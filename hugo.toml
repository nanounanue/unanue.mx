baseURL = "https://unanue.mx/"
languageCode = "en"
title = "Adolfo De Unánue"
theme = "unanue"
enableRobotsTXT = true

[params]
  # Fallback description for pages with neither a description nor a summary;
  # rendered as "<title> — <description>". See layouts/partials/meta.html.
  description = "data science, machine learning, and operations research on national-scale infrastructure."
  # Author of every page: <meta name="author">, and article:author on posts.
  # Set here, not in front matter: post headers carry author:nil, so ox-hugo
  # exports no author field. See layouts/partials/meta.html.
  author = "Adolfo De Unánue"
  # GoatCounter account name only — the part before .goatcounter.com.
  # Empty means no analytics script is emitted at all.
  goatcounter = "nanounanue"
  # Full URL of the Substack subscribe page. Empty hides the footer link
  # rather than pointing it at a dead "#".
  subscribe_url = "https://nanounanue.substack.com/subscribe"

[minify.tdewolff.html]
  # Keep attribute quotes so plain-text checks such as
  # grep 'rel="canonical"' match the minified output.
  keepQuotes = true

[markup]
  [markup.goldmark.renderer]
    # ox-hugo emits raw HTML for org constructs; goldmark must keep it
    unsafe = true
