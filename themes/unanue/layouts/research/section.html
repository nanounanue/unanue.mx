{{ define "main" }}
<div class="measure section" style="max-width: 760px;">
  <h1>{{ .Title }}</h1>
  <div class="intro">{{ .Content }}</div>
  {{ if .Pages }}
  <div style="margin-top: 28px;">
    {{ range .Pages.ByDate.Reverse }}
    {{ partial "publication.html" . }}
    {{ end }}
  </div>
  {{ end }}
</div>
{{ end }}
